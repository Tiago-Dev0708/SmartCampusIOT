name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint_and_test:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install Poetry
        run: pip install poetry==1.8.2

      - name: Install Dependencies
        run: poetry install --no-root

      - name: Run Ruff (Linter & Formatter)
        run: poetry run ruff check .

      - name: Run Mypy (Type Checking)
        run: poetry run mypy src/

  security_scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (Security Scan)
        run: bandit -r src/ -ll

  build_and_deploy:
    name: Build & Deploy to CachyOS
    needs: [lint_and_test, security_scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Inject Environment Secrets (.env)
        run: |
          echo "CLOUDFLARE_TOKEN=${{ secrets.CLOUDFLARE_TOKEN }}" > .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          echo "DATABASE_URL=postgresql+asyncpg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/smartcampus" >> .env
          echo "ENVIRONMENT=prod" >> .env
          echo "LOG_LEVEL=INFO" >> .env
          # O túnel do Cloudflare aceitará a origens mapeadas (ex: duckdns)
          echo 'ALLOWED_ORIGINS=["*"]' >> .env

      - name: Execute Deploy Script
        run: |
          chmod +x deploy.sh
          ./deploy.sh
